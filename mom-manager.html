<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妈妈管理 | LoveFamily</title><link rel="stylesheet" href="assets/family-tools.css"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{padding:24px;border:1px solid var(--line);border-radius:18px;background:#fffdf9}.box h2{margin:0}.box p{color:var(--muted);font-size:13px}.field{display:block;margin-top:14px}.field span{display:block;margin-bottom:6px;color:var(--muted)!important;font-size:11px}.field input,.field select,.field textarea{width:100%;min-height:43px;padding:10px;border:1px solid var(--line);border-radius:9px;color:var(--ink)!important;background:#fff!important}.field select option{color:var(--ink);background:#fff}.field textarea{min-height:120px}.item{margin-top:10px;padding:12px;border-radius:10px;background:var(--cream);font-size:13px}.item small{display:block;margin-top:4px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header class="shell site-header"><a class="brand" href="index.html"><span class="brand-mark">♥</span>LoveFamily</a><a class="back" href="word-garden.html">← 单词花园</a></header><section class="tool-hero"><div class="shell hero-inner"><div class="eyebrow">Mom's learning studio</div><h1>为多多准备<br>今天的小任务。</h1><p class="hero-copy">新建词库后，选择一个词库发布“记单词”任务。</p></div></section><main class="shell main"><div class="grid"><section class="box"><h2>发布今日任务</h2><p>当前任务类型固定为：记单词。</p><form id="task-form"><label class="field"><span>任务日期</span><input id="date" type="date" required></label><label class="field"><span>选择词库</span><select id="task-library"></select></label><label class="field"><span>至少正确次数</span><select id="target"><option>5</option><option selected>8</option><option>10</option></select></label><button class="button primary" type="submit">发布记单词任务</button></form><div id="tasks"></div></section><section class="box"><h2>新增词库</h2><p>每行一个单词，格式为 <code>English, 中文</code>。</p><form id="library-form"><label class="field"><span>词库名称</span><input id="title" placeholder="例如：P1 动物朋友" required></label><label class="field"><span>主题</span><input id="topic" placeholder="例如：常见动物" required></label><label class="field"><span>单词列表</span><textarea id="words" placeholder="cat, 猫&#10;dog, 狗" required></textarea></label><button class="button coral" type="submit">新增并发布词库</button></form><div id="libraries"></div></section></div></main><script src="assets/mom-manager.js"></script></body></html>
